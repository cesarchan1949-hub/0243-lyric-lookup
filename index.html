<!doctype html>
<html lang="zh-Hans" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101319" />
    <meta
      name="description"
      content="八爪鱼粤语填词，支持 0243 数字词云、押韵词云、粤拼和汉字查询。"
    />
    <title>八爪鱼粤语填词</title>
    <link rel="icon" href="assets/octopus-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img class="brand-logo" src="assets/octopus-logo.png" alt="" />
          </div>
          <div>
            <h1 data-i18n="appTitle">八爪鱼粤语填词</h1>
            <p class="eyebrow">CANTONESE LYRIC WORDS</p>
          </div>
        </div>
        <nav class="primary-nav" aria-label="查询模式">
          <div class="segmented" role="tablist">
            <button class="segment active" type="button" data-mode="auto" data-i18n="modeAuto">自动</button>
            <button class="segment" type="button" data-mode="pattern">0243</button>
            <button class="segment" type="button" data-mode="rhyme" data-i18n="modeRhyme">押韵</button>
            <button class="segment" type="button" data-mode="chinese" data-i18n="modeChinese">汉字</button>
            <button class="segment" type="button" data-mode="jyutping" data-i18n="modeJyutping">粤拼</button>
          </div>
        </nav>
        <div class="stats" aria-live="polite">
          <button class="focus-search icon-button" id="focusSearch" type="button" title="搜索" aria-label="搜索" data-i18n-title="search" data-i18n-aria="search"><span class="ui-icon icon-search" aria-hidden="true"></span></button>
          <span id="entryCount">载入中</span>
          <span id="charCount"></span>
          <button class="script-toggle" id="scriptToggle" type="button" title="切换繁体显示" aria-label="切换繁体显示">
            繁
          </button>
          <button class="theme-toggle" id="themeToggle" type="button" title="切换浅色模式" aria-label="切换浅色模式">
            ☀
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="search-panel" aria-label="查字工作台">
          <div class="search-box">
            <input
              id="queryInput"
              type="search"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="queryPlaceholder"
              data-i18n-aria="queryAria"
              placeholder="33 / 33ong / 33当 / 先生 / syut"
              aria-label="输入查询"
            />
            <button class="icon-button" id="clearButton" type="button" title="清空" data-i18n-title="clear">
              ×
            </button>
            <button class="submit-button" id="submitQuery" type="button" title="查询" aria-label="查询" data-i18n-title="submit" data-i18n-aria="submit"><span class="ui-icon icon-arrow" aria-hidden="true"></span></button>
          </div>

          <div class="control-row">
            <div id="analysisPanel" class="analysis-panel" aria-live="polite"></div>
            <label class="toggle">
              <input id="looseToggle" type="checkbox" />
              <span data-i18n="loose">宽松包含</span>
            </label>
          </div>

          <div id="cloudTools" class="cloud-tools hidden" aria-label="词云筛选">
            <div class="cloud-search">
              <span class="ui-icon icon-search" aria-hidden="true"></span>
              <input
                id="cloudSearchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="cloudSearchPlaceholder"
                data-i18n-aria="cloudSearchAria"
                placeholder="搜索 / 近义意图，例如：可惜"
                aria-label="在当前词云里搜索或输入近义意图"
              />
              <button class="icon-button" id="clearCloudSearchButton" type="button" title="清空词云搜索" data-i18n-title="clearCloudSearch">
                ×
              </button>
            </div>
            <div class="cloud-controls">
              <div class="cloud-control-row">
                <div class="mini-segmented" aria-label="智能分类方式">
                  <button class="mini-segment active" type="button" data-cloud-facet="all" data-i18n="all">全部</button>
                  <button class="mini-segment" type="button" data-cloud-facet="pos" data-i18n="pos">词性</button>
                  <button class="mini-segment" type="button" data-cloud-facet="emotion" data-i18n="emotion">情绪</button>
                </div>
                <label class="quality-toggle">
                  <input id="commonOnlyToggle" type="checkbox" />
                  <span data-i18n="commonOnly">仅看高频词</span>
                </label>
              </div>
              <div id="cloudCategoryBar" class="category-bar"></div>
            </div>
          </div>

          <div class="result-head">
            <h2 id="resultTitle" data-i18n="results">结果</h2>
            <span id="resultCount"></span>
            <div id="resultControls" class="result-controls hidden">
              <select id="resultSort" aria-label="结果排序" data-i18n-aria="sort">
                <option value="default" data-i18n="sortDefault">默认排序</option>
                <option value="short" data-i18n="sortShort">字数从少到多</option>
                <option value="long" data-i18n="sortLong">字数从多到少</option>
              </select>
              <div class="view-switch" role="group" aria-label="显示方式">
                <button type="button" data-view="grid" class="active" aria-pressed="true" title="网格显示" aria-label="网格显示" data-i18n-title="grid" data-i18n-aria="grid"><span class="ui-icon icon-grid" aria-hidden="true"></span></button>
                <button type="button" data-view="list" aria-pressed="false" title="列表显示" aria-label="列表显示" data-i18n-title="list" data-i18n-aria="list"><span class="ui-icon icon-list" aria-hidden="true"></span></button>
              </div>
            </div>
          </div>

          <div id="emptyState" class="empty-state">
            <div class="sample-grid">
              <button type="button" data-query="33">33</button>
              <button type="button" data-query="3434">3434</button>
              <button type="button" data-query="33ong">33ong</button>
              <button type="button" data-query="33当">33当</button>
              <button type="button" data-query="先生">先生</button>
              <button type="button" data-query="syut">syut</button>
            </div>
          </div>

          <div id="results" class="results" aria-live="polite"></div>
          <div id="loadMore" class="load-more hidden" aria-live="polite">
            <button id="loadMoreButton" type="button">继续显示</button>
            <span id="loadMoreStatus"></span>
          </div>
        </section>
      </main>
      <footer class="site-footer"><span data-i18n="footer">更多灵感，始于一个词</span></footer>
    </div>
  </body>
</html>
